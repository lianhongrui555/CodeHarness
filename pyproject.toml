[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-harness"
version = "0.1.0"
description = "A local Python Agent Harness for code projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
code-harness = "code_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
